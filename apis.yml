aid: drivemate
name: Drivemate
description: >-
  Drivemate is a peer-to-peer car-sharing and car-rental marketplace based in
  Bangkok, Thailand, founded in 2016. The platform lets vehicle owners list their
  cars and lets travelers and residents rent directly from those owners through
  the Drivemate mobile app and website, handling booking, verification, insurance
  and payments end to end. Drivemate operates one of the largest car-rental
  selections in Thailand with more than 3,000 vehicles across 35 provinces and a
  community of over 100,000 users, and has raised Series A funding from investors
  including 500 Global (500 Startups), NetSol, Isuzu UNT and Colopl Next. This API
  Evangelist profile tracks the company's public digital and developer surface;
  Drivemate is a consumer mobility marketplace and does not currently publish a
  public developer API program, so this record captures identity, distribution and
  domain-security signals rather than API specifications.
